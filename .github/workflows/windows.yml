name: windows

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'src/unittest/**'
      - 'src/defaultsettings.cpp'
      - 'minetest.conf.example'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'util/buildbot/**'
      - 'misc/*'
      - 'client/shaders/**'
      - 'builtin/settingtypes.txt'
      - 'util/pbr/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
      - 'util/test_multiplayer.sh'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'src/unittest/**'
      - 'src/defaultsettings.cpp'
      - 'minetest.conf.example'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'util/buildbot/**'
      - 'misc/*'
      - 'client/shaders/**'
      - 'builtin/settingtypes.txt'
      - 'util/pbr/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
      - 'util/test_multiplayer.sh'

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build Windows x64 packages and publish a GitHub prerelease after GL3 POM verification"
        required: false
        type: boolean
        default: false

jobs:
  mingw:
    name: "MinGW cross-compiler (${{ matrix.config.bits }}-bit)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { bits: 32, nsis: false }
          - { bits: 64, nsis: true }
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler
        run: |
          source ./util/ci/common.sh
          install_mingw_deps '${{matrix.config.bits}}' '${{matrix.config.nsis}}'
          if '${{matrix.config.nsis}}'; then
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache' >>$GITHUB_ENV
          fi
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build
        run: |
           EXISTING_MINETEST_DIR=$PWD \
           ./util/buildbot/buildwin${{ matrix.config.bits }}.sh B -DINSTALL_DEVTEST=1
           mkdir -p artifact
           cp -v B/build/*.zip artifact/

      # Check that the resulting binary can run (DLLs etc.)
      - name: Runtime test
        run: |
          dest=$(mktemp -d)
          unzip -t artifact/*.zip
          unzip -q -d "$dest" artifact/*.zip
          cd "$dest"/luanti-*-win*
          for required in \
            builtin/init.lua \
            builtin/settingtypes.txt \
            client/shaders/nodes_shader/opengl_vertex.glsl \
            client/shaders/nodes_shader/opengl_fragment.glsl \
            games/devtest/game.conf \
            games/devtest/mods/basenodes/init.lua \
            doc/pbr.md \
            doc/devtest_texture_mapping.json; do
            test -f "$required" || { echo "Missing portable package file: $required"; exit 1; }
          done
          grep -q '^enable_pbr ' builtin/settingtypes.txt
          wine bin/luanti.exe --version

      - name: Generate portable package checksum
        run: |
          sha256sum artifact/*.zip | sed 's|artifact/||' > artifact/SHA256SUMS.txt

      - name: Build for NSIS
        run: |
           EXISTING_MINETEST_DIR=$PWD \
           ./util/buildbot/buildwin${{ matrix.config.bits }}.sh B -DRUN_IN_PLACE=0
           dest=$(mktemp -d)
           unzip -q -d "$dest" B/build/*.zip
           cd "$dest"/luanti-*-nsis
           makensis -WX -V3 sfx-launcher.nsi
           cp -v "$dest"/*.exe $GITHUB_WORKSPACE/artifact/
        if: ${{ matrix.config.nsis }}

      - uses: actions/upload-artifact@v7
        with:
          name: mingw-${{ matrix.config.bits }}-portable
          archive: true
          path: |
            artifact/*.zip
            artifact/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mingw-${{ matrix.config.bits }}-installer
          archive: false
          path: artifact/*.exe
          if-no-files-found: error
        if: ${{ matrix.config.nsis }}

  msvc:
    name: VS 2026 ${{ matrix.config.arch }}
    runs-on: windows-2025-vs2026
    env:
      VCPKG_DEFAULT_TRIPLET: ${{matrix.config.vcpkg_triplet}}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_DISABLE_METRICS: 1
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              arch: x86,
              generator: "-G'Visual Studio 18 2026' -A Win32",
              vcpkg_triplet: x86-windows
            }
          - {
              arch: x64,
              generator: "-G'Visual Studio 18 2026' -A x64",
              vcpkg_triplet: x64-windows
            }

    steps:
      - uses: actions/checkout@v7

      - name: Setup vcpkg
        id: setup-vcpkg
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\vcpkg -ErrorAction Continue
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          Write-Host "builtin-baseline: $baseline"
          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force vcpkg_cache | Out-Null
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $baseline
          .\vcpkg\bootstrap-vcpkg.bat
          Add-Content -Path "${{ github.workspace }}\vcpkg\triplets\${{ matrix.config.vcpkg_triplet }}.cmake" -Value "`nset(VCPKG_DISABLE_COMPILER_TRACKING ON)"

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: &vcpkg_cache_paths |
            ${{ github.workspace }}\vcpkg\downloads
            ${{ github.workspace }}\vcpkg_cache
          key: &vcpkg_cache_key ${{ runner.os }}-vcpkg-${{ matrix.config.vcpkg_triplet }}-${{ steps.setup-vcpkg.outputs.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.config.vcpkg_triplet }}-${{ steps.setup-vcpkg.outputs.VCPKG_BASELINE }}-

      - name: CMake
        id: cmake
        run: |
          cmake ${{matrix.config.generator}}  `
          -DVCPKG_INSTALL_OPTIONS="--x-abi-tools-use-exact-versions"  `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"  `
          -DCMAKE_BUILD_TYPE=Release  `
          -DENABLE_POSTGRESQL=OFF  `
          -DENABLE_LUAJIT=TRUE  `
          -DREQUIRE_LUAJIT=TRUE  `
          -DINSTALL_DEVTEST=1  `
          -DRUN_IN_PLACE=1 .

      - name: Build
        run: cmake --build . --config Release

      - name: Unittests
        # need this workaround for stdout to work
        run: |
          $proc = start .\bin\Release\luanti.exe --run-unittests -NoNewWindow -Wait -PassThru
          exit $proc.ExitCode

      - name: CPack
        run: |
          cpack -G ZIP -B "$env:GITHUB_WORKSPACE\Package"
          rm -r $env:GITHUB_WORKSPACE\Package\_CPack_Packages
          Get-ChildItem "$env:GITHUB_WORKSPACE\Package\*.zip" | Rename-Item -NewName { $_.Name -replace '\.zip$', '-msvc.zip' }

      - name: Validate MSVC portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\Package" -Filter "*.zip" |
            Select-Object -First 1
          if (-not $zip) { throw "CPack did not produce a ZIP package." }
          $expanded = Join-Path $env:RUNNER_TEMP "luanti-pbr-portable"
          Remove-Item -Recurse -Force $expanded -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $expanded | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded
          .\util\pbr\validate_windows_package.ps1 -PackageRoot $expanded

      - name: Generate Windows package checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:GITHUB_WORKSPACE\Package" -Filter "*.zip"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "$env:GITHUB_WORKSPACE\Package\SHA256SUMS.txt"

      - name: Save vcpkg cache
        uses: actions/cache/save@v6
        if: always() && steps.cmake.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: *vcpkg_cache_paths
          key: *vcpkg_cache_key

      - uses: actions/upload-artifact@v7
        with:
          name: msvc-${{ matrix.config.arch }}-portable
          archive: true
          path: |
            .\Package\*.zip
            .\Package\SHA256SUMS.txt
          if-no-files-found: error

  release-windows-x64:
    name: Publish verified Windows x64 prerelease
    if: >-
      github.ref == 'refs/heads/master' &&
      (
        (github.event_name == 'push' &&
         startsWith(github.event.head_commit.message, 'Release: LabPBR/POM Windows x64')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      )
    needs: [mingw, msvc]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      RELEASE_TAG: labpbr-pom-win64-2026.11.09
    steps:
      - name: Download MinGW x64 portable package
        uses: actions/download-artifact@v8
        with:
          name: mingw-64-portable
          path: release/mingw

      - name: Download MSVC x64 portable package
        uses: actions/download-artifact@v8
        with:
          name: msvc-x64-portable
          path: release/msvc

      - name: Verify packages and checksums
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t mingw_packages < <(find release/mingw -maxdepth 1 -type f -name '*.zip' -print)
          mapfile -t msvc_packages < <(find release/msvc -maxdepth 1 -type f -name '*.zip' -print)
          if [[ "${#mingw_packages[@]}" -ne 1 || "${#msvc_packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one MinGW x64 ZIP and one MSVC x64 ZIP." >&2
            find release -maxdepth 2 -type f -print
            exit 1
          fi

          test -s release/mingw/SHA256SUMS.txt
          test -s release/msvc/SHA256SUMS.txt
          (cd release/mingw && sha256sum --check SHA256SUMS.txt)
          (cd release/msvc && sha256sum --check SHA256SUMS.txt)
          unzip -t "${mingw_packages[0]}"
          unzip -t "${msvc_packages[0]}"

          {
            (cd release/mingw && sha256sum *.zip)
            (cd release/msvc && sha256sum *.zip)
          } > release/SHA256SUMS.txt

          echo "MINGW_PACKAGE=${mingw_packages[0]}" >> "$GITHUB_ENV"
          echo "MSVC_PACKAGE=${msvc_packages[0]}" >> "$GITHUB_ENV"
          cat release/SHA256SUMS.txt

      - name: Dispatch Linux GL3/POM verification on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_master="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq '.sha')"
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            echo "master moved from $GITHUB_SHA to $current_master; refusing to publish a build from a stale commit." >&2
            exit 1
          fi

          gh workflow run linux.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "Dispatched linux.yml for master at $GITHUB_SHA."

      - name: Wait for Linux and GL3 POM visual verification on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 240); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow linux.yml \
              --branch master \
              --commit "$GITHUB_SHA" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,status,conclusion,headSha,event)"
            success_id="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")][0].databaseId // empty' <<< "$runs")"
            failed_id="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required"))][0].databaseId // empty' <<< "$runs")"

            if [[ -n "$success_id" ]]; then
              echo "Linux/GL3/POM CI passed on $GITHUB_SHA (run $success_id)."
              echo "LINUX_RUN_ID=$success_id" >> "$GITHUB_ENV"
              exit 0
            fi
            if [[ -n "$failed_id" ]]; then
              echo "Linux/GL3/POM CI failed on $GITHUB_SHA (run $failed_id)." >&2
              exit 1
            fi
            echo "Waiting for Linux/GL3/POM CI on $GITHUB_SHA (attempt $attempt/240)..."
            sleep 10
          done

          echo "Timed out waiting for Linux/GL3/POM CI on $GITHUB_SHA." >&2
          exit 1

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## Luanti engine LabPBR + Parallax Occlusion Mapping — Windows x64

          This is a custom-engine prerelease from commit $GITHUB_SHA in hashin9973-ux/luanti. It is not an official upstream Luanti release.

          ### Portable packages

          - MinGW x64 portable ZIP: $(basename "$MINGW_PACKAGE")
          - MSVC x64 portable ZIP: $(basename "$MSVC_PACKAGE")
          - SHA256SUMS.txt: SHA-256 checksums for both ZIP files

          ### CI verification

          - MinGW x64 package build, archive checks, and Wine luanti.exe --version invocation (not a gameplay session).
          - MSVC x64 release build, C++ unit tests, native executable version check, and portable-package validation.
          - Linux workflow success on this exact source commit, including the GL3 optional-map shader matrix and rendered POM on/off image comparison.
          - Both release ZIPs were rechecked for archive integrity and against their build-generated SHA-256 manifests before publication.

          ### Scope and limitations

          - The build contains the engine-level LabPBR/POM implementation and the repository's Devtest game content.
          - The external Parallax PBR source archive is used only by CI tests and is not redistributed in these release assets.
          - The GL3 image comparison is a deterministic CI rendering check; it is not certification across every hardware GPU or driver.
          - LabPBR porosity/subsurface and complete conductor optical-constant support remain documented limitations.

          Source commit: $GITHUB_SHA
          Windows workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Linux GL3/POM verification run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN_ID
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag $RELEASE_TAG." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$MINGW_PACKAGE" \
            "$MSVC_PACKAGE" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Luanti LabPBR + POM — Windows x64" \
            --notes-file release/release-notes.md \
            --prerelease \
            --latest=false
